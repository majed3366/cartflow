<h1>أدلة غير كافية</h1>
<p>لا توجد أدلة كافية بعد لاتخاذ قرار تشغيلي موثوق.</p>
<p><b>الإجراء</b> اترك الودجيت ومسار الاسترجاع يعملان لجمع أدلة مؤهّلة — بدون تغيير السعر أو الشحن.</p>
<p><b>إعادة الفحص</b> أعد القرار عند توفر تشخيص مدعوم، أو عند وصول أسباب التردد إلى 8 على الأقل.</p>
